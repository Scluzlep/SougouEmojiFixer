name: Android APK / Release
on:
  push:
    branches: [master, main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android 17 SDK
        run: sdkmanager --install 'platforms;android-37' 'build-tools;37.0.0'
      - name: Build installable APK
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p dist
          if [[ -n "$SIGNING_STORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/SougouEmojiFixer-Zip-release.apk
          else
            echo '::warning::No signing secrets configured; this is a DEBUG-signed build and cannot be used as a stable in-place update.'
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/SougouEmojiFixer-Zip-debug.apk
          fi
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: SougouEmojiFixer-Zip-APK
          path: dist/*
      - name: Publish GitHub Release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
