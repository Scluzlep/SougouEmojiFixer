name: Android APK / Release
on:
  push:
    branches: [master, main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
          # API 37 preview is installed as android-37.0, while AGP may look for android-37.
          if [[ ! -e "$SDK_ROOT/platforms/android-37" && -d "$SDK_ROOT/platforms/android-37.0" ]]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi
      - name: Build installable APK
        env:
          SIGNING_STORE_BASE64: ${{ secrets.SIGNING_STORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [[ -z "$SIGNING_STORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo '::error::Release signing secrets are missing. Refusing to publish a debug-signed APK as a release.'
              exit 1
            fi
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.p12"
            printf '%s' "$SIGNING_STORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/SougouEmojiFixer-Zip-release.apk
            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -x "$APKSIGNER"
            "$APKSIGNER" verify --verbose dist/SougouEmojiFixer-Zip-release.apk
          else
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk dist/SougouEmojiFixer-Zip-debug.apk
          fi
          ( cd dist && sha256sum *.apk > SHA256SUMS.txt )
      - uses: actions/upload-artifact@v4
        with:
          name: SougouEmojiFixer-Zip-APK
          path: dist/*
      - name: Publish GitHub Release when tagged
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
